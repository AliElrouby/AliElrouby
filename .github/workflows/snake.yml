name: Update Retro Arcade snake (all time)

on:
  schedule:
    - cron: '23 4 * * *' # daily at 04:23 UTC, so recent days match the GitHub calendar
  push:
    branches: [main]
    paths:
      - scripts/generate_arcade_snake.py
      - .github/workflows/snake.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arcade-snake
  cancel-in-progress: false

jobs:
  arcade-snake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate animated arcade snake from all-time contributions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_arcade_snake.py --user AliElrouby --output assets/arcade-snake.svg

      - name: Publish SVG to main branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/arcade-snake.svg
          if git diff --cached --quiet; then
            echo "Contribution image unchanged"
            exit 0
          fi
          git commit -m "Refresh retro arcade contribution snake (all time)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
