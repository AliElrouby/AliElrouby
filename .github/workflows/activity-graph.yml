name: Update Neural Atlas activity graph

on:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * *'  # daily, UTC

permissions:
  contents: write

jobs:
  update-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate activity SVG using GitHub contribution data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python scripts/generate_activity_graph.py
      - name: Commit the generated image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-graph.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh Neural Atlas activity graph"
            git push
          else
            echo "Activity graph is already up to date."
          fi
