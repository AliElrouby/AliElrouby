name: Update Retro Arcade snake (2 years)

on:
  schedule:
    - cron: '23 4 * * 1' # Monday at 04:23 UTC (once a week)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  arcade-snake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate animated arcade snake from 2 years of contributions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_arcade_snake.py --user AliElrouby --output assets/arcade-snake.svg

      - name: Publish SVG to main branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/arcade-snake.svg
          if ! git diff --cached --quiet; then
            git commit -m "Refresh retro arcade contribution snake (2y)"
            git push
          else
            echo "Contribution image unchanged"
          fi
